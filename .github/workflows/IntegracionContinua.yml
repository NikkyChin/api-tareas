# Workflow de Integración Continua (CI) para la aplicación "api-tareas".
# Se ejecuta automáticamente en cada push a la rama main.
#
# El pipeline está dividido en tres jobs:
# 1. Build: descarga el código, configura Node.js e instala las dependencias.
# 2. Test: ejecuta las pruebas automatizadas para validar el funcionamiento de la API.
# 3. Docker: inicia sesión en GitHub Container Registry (GHCR), construye la imagen Docker y la publica en GHCR.
#
# La ejecución es secuencial mediante "needs": Build → Test → Docker.
# Si un job falla, los siguientes no se ejecutan.

name: Integración Continua

on:
  push:
    branches:
      - main

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/nikkychin/api-tareas:latest .

      - name: Push Docker image
        run: docker push ghcr.io/nikkychin/api-tareas:latest